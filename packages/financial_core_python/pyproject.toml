[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "money-pilot-financial-core"
version = "0.1.0"
description = "Deterministic, integer-only personal finance calculations for MoneyPilot"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
