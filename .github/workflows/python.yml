name: Python checks

on:
  push:
    paths:
      - "services/api/**"
      - "packages/financial_core_python/**"
      - "packages/financial_contracts/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "packages/financial_core_python/**"
      - "packages/financial_contracts/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/api/requirements.txt
            services/api/pyproject.toml
            packages/financial_core_python/pyproject.toml
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pushd services/api
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install -e ".[dev]"
          fi
          popd
          python -m pip install ruff
      - name: Format
        run: python -m ruff format --check services/api packages/financial_core_python
      - name: Lint
        run: python -m ruff check services/api packages/financial_core_python
      - name: Compile
        run: python -m compileall -q services/api/src packages/financial_core_python/src
      - name: Test
        shell: bash
        run: |
          mkdir -p test-results
          paths=(packages/financial_core_python/tests)
          if [[ -d services/api/tests ]]; then paths+=(services/api/tests); fi
          python -m pytest "${paths[@]}" --junitxml=test-results/python.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-test-results
          path: test-results/python.xml
          if-no-files-found: warn
