name: Flutter checks

on:
  push:
    paths:
      - "apps/money_pilot/**"
      - "packages/financial_contracts/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "apps/money_pilot/**"
      - "packages/financial_contracts/**"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/money_pilot
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/money_pilot
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Resolve packages
        run: flutter pub get
      - name: Build release
        run: flutter build windows --release
      - name: Smoke launch
        shell: pwsh
        run: |
          $exe = Resolve-Path "build/windows/x64/runner/Release/money_pilot.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "MoneyPilot exited during smoke launch." }
          Stop-Process -Id $process.Id
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MoneyPilot-Windows
          path: apps/money_pilot/build/windows/x64/runner/Release/
          if-no-files-found: error
