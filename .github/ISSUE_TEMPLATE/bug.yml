name: Bug report
description: Report reproducible behavior that does not work as expected.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: Please remove personal and financial information before submitting.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. See...
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Windows 11, Android 15, or another platform
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: Commit hash if known
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove credentials, account data, email addresses, and financial values.
