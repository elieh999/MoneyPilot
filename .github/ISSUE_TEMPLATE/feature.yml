name: Feature request
description: Suggest a focused improvement to MoneyPilot.
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this change solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested change
      description: Describe the smallest useful version of the idea.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Flutter client
        - API
        - Financial calculations
        - Documentation
        - Other
    validations:
      required: true
